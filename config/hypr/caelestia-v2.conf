# Deblestia Shell v2 — Caelestia Shell integration.
# Generated as a separate include so the existing KooL configuration remains intact.

exec-once = ~/.config/hypr/scripts/caelestia-v2-launch.sh
exec-once = ~/.config/hypr/scripts/caelestia-v2-display-profile.sh oled
exec-once = ~/.local/bin/mpvpaper-enginectl restore

# Current Hyprland/Quickshell global shortcuts.
bind = SUPER, SPACE, global, caelestia:launcher
bind = SUPER, D, global, caelestia:dashboard
bind = SUPER, N, global, caelestia:sidebar
bind = SUPER, M, global, caelestia:utilities
bind = SUPER, L, exec, ~/.config/hypr/scripts/caelestia-v2-lock.sh
bind = SUPER SHIFT, O, exec, ~/.config/hypr/scripts/caelestia-v2-display-profile.sh toggle
bind = CTRL ALT, DELETE, global, caelestia:session

# IPC fallbacks remain handy when a compositor update breaks global-shortcuts-v1.
bind = SUPER SHIFT, SPACE, exec, caelestia shell drawers toggle launcher

# Frosted, immersive layer surfaces (Hyprland 0.50+ rule syntax).
layerrule = blur true, match:namespace caelestia-.*
layerrule = ignore_alpha 0.55, match:namespace caelestia-.*

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.88

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.22
    }
}

animations {
    enabled = true
    bezier = immersive, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, immersive, popin 84%
    animation = windowsOut, 1, 4, immersive, popin 84%
    animation = fade, 1, 4, immersive
    animation = workspaces, 1, 5, immersive, slidefade 18%
}
