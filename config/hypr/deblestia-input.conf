# Navigation Deblestia entre les bureaux.
# Trois doigts horizontalement sur le pavé tactile.
gesture = 3, horizontal, workspace

# Les affectations et la persistance vivent dans deblestia-workspaces.conf.
# Garder ce fichier centré sur la navigation évite les règles concurrentes.

gestures {
    workspace_swipe_distance = 180
    workspace_swipe_cancel_ratio = 0.25
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
    workspace_swipe_direction_lock = true
}

# Capture PNG directe : touche Impr. écran, sans ouvrir d'éditeur.
bindd = , Print, Capture PNG complète, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/deblestia-$(date +%Y%m%d-%H%M%S).png"'
bindd = SUPER SHIFT, P, Capture PNG complète, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots" && grim "$HOME/Pictures/Screenshots/deblestia-$(date +%Y%m%d-%H%M%S).png"'
