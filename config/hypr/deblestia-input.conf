# Navigation Deblestia entre les bureaux.
# Trois doigts horizontalement sur le pavé tactile.
gesture = 3, horizontal, workspace

# Les boutons Waybar n'instancient pas les bureaux. Les conserver réellement
# permet au geste de parcourir 1 à 10, même lorsque les bureaux sont vides.
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true
workspace = 10, persistent:true

gestures {
    workspace_swipe_distance = 180
    workspace_swipe_cancel_ratio = 0.25
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
    workspace_swipe_direction_lock = true
}
