# Deblestia Nova — shell Quickshell adapté à Debian.
# Ce fichier est séparé des dotfiles existants et peut être retiré sans les écraser.

# L'interface active est lancée par l'inclusion commune deblestia-ui.conf.

bind = SUPER, SPACE, global, quickshell:searchToggle
bind = SUPER, ESCAPE, global, quickshell:settingsToggle
bind = SUPER, N, global, quickshell:sidebarRightToggle
bind = SUPER SHIFT, N, global, quickshell:sidebarLeftToggle
bind = CTRL ALT, DELETE, global, quickshell:sessionToggle
bind = SUPER, L, exec, ~/.config/hypr/scripts/deblestia-nova-lock.sh
bind = SUPER SHIFT, W, global, quickshell:wallpaperSelectorToggle
bind = SUPER SHIFT, B, global, quickshell:barToggle

layerrule = blur true, match:namespace quickshell:.*
layerrule = ignore_alpha 0.45, match:namespace quickshell:.*

decoration {
    rounding = 18
    active_opacity = 0.97
    inactive_opacity = 0.90

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.20
    }
}

animations {
    enabled = true
    bezier = nova, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, nova, popin 86%
    animation = windowsOut, 1, 4, nova, popin 86%
    animation = fade, 1, 4, nova
    animation = workspaces, 1, 5, nova, slidefade 16%
}
